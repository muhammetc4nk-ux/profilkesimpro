plugins {
    id 'com.android.application'
}

android {
    namespace 'com.profilkesim.pro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.profilkesim.pro'
        minSdk 23
        targetSdk 34
        versionCode 12
        versionName '2.1.9'
    }

    def workshopKey = providers.environmentVariable('ATOLYE_KEYSTORE_FILE').orNull
    def workshopPassword = providers.environmentVariable('ATOLYE_KEYSTORE_PASSWORD_FILE').orNull

    signingConfigs {
        if (workshopKey && workshopPassword) {
            workshop {
                def password = file(workshopPassword).text.trim()
                storeFile file(workshopKey)
                storeType 'PKCS12'
                storePassword password
                keyAlias 'kesim-atolye'
                keyPassword password
            }
        }
    }

    buildTypes {
        release {
            // Keep updates compatible with the installed, signed 2.1.0 APK.
            applicationIdSuffix '.atolye'
            if (workshopKey && workshopPassword) {
                signingConfig signingConfigs.workshop
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.core:core:1.9.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
}
